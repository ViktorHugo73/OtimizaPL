services:

  db:
    image: postgres:16

    container_name: tcc_otimizador_db

    environment:
      POSTGRES_DB: tcc_otimizador
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U tcc -d tcc_otimizador"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data: